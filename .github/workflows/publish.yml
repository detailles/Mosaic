name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC — npm trusted publishing + provenance, no stored token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: npm run build

      # Idempotent: skip silently when this version is already on the registry
      # (e.g. the first release was published manually).
      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already published, skipping"
          else
            npm publish --provenance --access public
          fi
