<svg viewBox="0 0 720 240" width="720" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sl-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2D3748; }
    .sl-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #718096; font-size: 10px; }
    .sl-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; font-size: 9px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .sl-text { fill: #E2E8F0; }
      .sl-sub { fill: #A0AEC0; }
      .sl-sep { stroke: #4A5568; }
    }
    @keyframes slPersist { 0%,8% { opacity: 0 } 12%,100% { opacity: 1 } }
    @keyframes slConsumeT1 { 0%,8% { opacity: 0 } 12%,38% { opacity: 1 } 42%,100% { opacity: 0 } }
    @keyframes slConsumeFlash { 0%,35% { opacity: 0 } 38%,42% { opacity: 1 } 45%,100% { opacity: 0 } }
    @keyframes slScopeT1 { 0%,8% { opacity: 0 } 12%,28% { opacity: 1 } 32%,100% { opacity: 0 } }
    @keyframes slScopeT2 { 0%,38% { opacity: 0 } 42%,60% { opacity: 1 } 64%,100% { opacity: 0 } }
    @keyframes slScopeT3 { 0%,68% { opacity: 0 } 72%,90% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes slTurnLine1 { 0%,28% { opacity: 0 } 30%,34% { opacity: 1 } 36%,100% { opacity: 0.3 } }
    @keyframes slTurnLine2 { 0%,60% { opacity: 0 } 62%,66% { opacity: 1 } 68%,100% { opacity: 0.3 } }
  </style>
  <text x="20" y="24" font-size="11" font-weight="700" class="sl-text">LIFECYCLE</text>
  <text x="220" y="24" font-size="11" font-weight="600" text-anchor="middle" class="sl-text">Turn 1</text>
  <text x="390" y="24" font-size="11" font-weight="600" text-anchor="middle" class="sl-text">Turn 2</text>
  <text x="560" y="24" font-size="11" font-weight="600" text-anchor="middle" class="sl-text">Turn 3</text>
  <line x1="305" y1="32" x2="305" y2="220" stroke="#C75C5C" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3" style="animation: slTurnLine1 8s infinite"/>
  <line x1="475" y1="32" x2="475" y2="220" stroke="#C75C5C" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3" style="animation: slTurnLine2 8s infinite"/>
  <text x="305" y="232" text-anchor="middle" font-size="9" fill="#C75C5C" class="sl-text" style="fill:#C75C5C; animation: slTurnLine1 8s infinite">nextTurn()</text>
  <text x="475" y="232" text-anchor="middle" font-size="9" fill="#C75C5C" class="sl-text" style="fill:#C75C5C; animation: slTurnLine2 8s infinite">nextTurn()</text>
  <text x="20" y="62" font-size="12" font-weight="600" class="sl-text">persistent</text>
  <text x="20" y="76" class="sl-sub">Stays until cleared</text>
  <rect x="135" y="44" width="540" height="38" rx="4" fill="#3A8F85" opacity="0" style="animation: slPersist 8s infinite"/>
  <text x="405" y="68" text-anchor="middle" class="sl-label" style="animation: slPersist 8s infinite">value persists across all turns</text>
  <text x="20" y="122" font-size="12" font-weight="600" class="sl-text">consume-once</text>
  <text x="20" y="136" class="sl-sub">Clears after get()</text>
  <rect x="135" y="104" width="168" height="38" rx="4" fill="#3A8F85" opacity="0" style="animation: slConsumeT1 8s infinite"/>
  <text x="219" y="128" text-anchor="middle" class="sl-label" style="animation: slConsumeT1 8s infinite">set(value)</text>
  <rect x="310" y="104" width="80" height="38" rx="4" fill="none" stroke="#D4A843" stroke-width="2" stroke-dasharray="4,2" opacity="0" style="animation: slConsumeFlash 8s infinite"/>
  <text x="350" y="127" text-anchor="middle" font-size="10" font-weight="600" fill="#D4A843" class="sl-text" style="fill:#D4A843; animation: slConsumeFlash 8s infinite">get() !</text>
  <text x="20" y="182" font-size="12" font-weight="600" class="sl-text">turn-scoped</text>
  <text x="20" y="196" class="sl-sub">Clears on nextTurn()</text>
  <rect x="135" y="164" width="168" height="38" rx="4" fill="#3A8F85" opacity="0" style="animation: slScopeT1 8s infinite"/>
  <text x="219" y="188" text-anchor="middle" class="sl-label" style="animation: slScopeT1 8s infinite">set(value)</text>
  <rect x="310" y="164" width="163" height="38" rx="4" fill="#3A8F85" opacity="0" style="animation: slScopeT2 8s infinite"/>
  <text x="391" y="188" text-anchor="middle" class="sl-label" style="animation: slScopeT2 8s infinite">set(value)</text>
  <rect x="480" y="164" width="195" height="38" rx="4" fill="#3A8F85" opacity="0" style="animation: slScopeT3 8s infinite"/>
  <text x="577" y="188" text-anchor="middle" class="sl-label" style="animation: slScopeT3 8s infinite">set(value)</text>
  <line x1="15" y1="88" x2="700" y2="88" class="sl-sep" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="15" y1="148" x2="700" y2="148" class="sl-sep" stroke="#E2E8F0" stroke-width="1"/>
</svg>
